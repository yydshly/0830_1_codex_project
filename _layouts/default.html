<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回研究首页">
          <span class="brand-mark">08·30</span>
          <span>{{ site.title }}</span>
        </a>
        <nav aria-label="主要导航">
          <a href="{{ '/projects/' | relative_url }}">项目</a>
          <a href="{{ '/docs/research-guide/' | relative_url }}">方法</a>
          <a href="{{ '/docs/decisions/' | relative_url }}">决策</a>
          <a href="https://github.com/{{ site.repository }}">GitHub</a>
        </nav>
      </div>
    </header>
    <main class="shell page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell">
        <span>问题 → 实验 → 证据 → 结论</span>
        <a href="https://github.com/{{ site.repository }}">查看源代码</a>
      </div>
    </footer>
  </body>
</html>
